<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PadhaiHub</title>
    <link rel="icon" type="image/png" href="icon1.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="login-screen" class="login-container">
        
        <div class="login-box">

            <button id="theme-toggle-login" class="btn-icon login-theme-btn" onclick="toggleDarkMode()">🌙</button>

            <div id="login-main-section">
                <h1 style="color: var(--primary-color); margin-bottom: 10px;">PadhaiHub</h1>
                <p id="auth-subtitle" style="margin-bottom: 20px;">Welcome back! Please log in.</p>
    
                <div class="auth-tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button id="tab-login" class="btn-primary" style="flex: 1;" onclick="switchAuthMode('login')">Log In</button>
                    <button id="tab-signup" class="btn-view" style="flex: 1;" onclick="switchAuthMode('signup')">Sign Up</button>
                </div>

                <input type="email" id="auth-email" placeholder="Email Address" style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                <input type="password" id="auth-password" placeholder="Password" style="width: 100%; margin-bottom: 5px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
    
                <div id="forgot-password-wrap" style="text-align: right; margin-bottom: 15px;">
                    <a href="#" style="color: var(--primary-color); font-size: 0.85rem; text-decoration: none; font-weight: bold;" onclick="resetPassword()">Forgot Password?</a>
                </div>

                <div id="signup-extras" class="hidden">
                    <input type="password" id="auth-confirm-password" placeholder="Confirm Password" style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
        
                    <select id="auth-role" style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 4px; border: 1px solid #ccc;" onchange="checkRole()">
                        <option value="student">I am a Student</option>
                        <option value="teacher">I am a Teacher</option>
                    </select>
                    <input type="password" id="teacher-code" class="hidden" placeholder="Teacher Secret Code" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                </div>

                <button id="auth-submit-btn" class="btn-success" style="width: 100%;" onclick="processAuth()">Secure Log In</button>
    
                <div style="text-align: center; margin: 15px 0; color: #888; font-size: 0.9rem;">OR</div>
    
                <button class="btn-view" style="width: 100%; background-color: #fff; color: #333; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold;" onclick="signInWithGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 18px;">
                    Sign in with Google
                    </button>
            </div>

            <div id="google-role-section" class="hidden" style="text-align: center;">
                <h2 style="color: var(--primary-color); margin-bottom: 15px;">Almost there!</h2>
                <p style="margin-bottom: 20px;">Are you joining as a Student or an Admin?</p>
                
                <select id="google-role" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 4px; border: 1px solid #ccc;" onchange="checkGoogleRole()">
                    <option value="student">I am a Student</option>
                    <option value="teacher">I am a Teacher</option>
                </select>
                
                <input type="password" id="google-teacher-code" class="hidden" placeholder="Teacher Secret Code" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                
                <button class="btn-success" style="width: 100%; margin-bottom: 10px;" onclick="finalizeGoogleSignup()">Complete Sign Up</button>
                <button class="btn-view" style="width: 100%;" onclick="cancelGoogleSignup()">Cancel</button>
            </div>

        </div>
    </div>

    <div id="app-screen" class="hidden">
        <nav>
            <h1>PadhaiHub</h1>
            <div class="nav-controls">
                <input type="text" id="search-bar" placeholder="Search notes..." onkeyup="applyFilters()">      
                
                <select id="semester-filter" onchange="updateSubjectDropdowns(); applyFilters(); renderAnnouncements();" style="padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin-right: 10px;">
                    <option value="All">All Semesters</option>
                    <option value="Semester 1">Semester 1</option>
                    <option value="Semester 2">Semester 2</option>
                    <option value="Semester 3">Semester 3</option>
                    <option value="Semester 4">Semester 4</option>
                    <option value="Semester 5">Semester 5</option>
                    <option value="Semester 6">Semester 6</option>
                    <option value="Semester 7">Semester 7</option>
                    <option value="Semester 8">Semester 8</option>
                    <option value="Semester 9">Semester 9</option>
                    <option value="Semester 10">Semester 10</option>
                </select>

                <select id="category-filter" onchange="applyFilters()" style="padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                    </select>

                <div id="notification-wrapper" class="hidden" style="position: relative;">
                    <button id="notification-btn" class="btn-icon" onclick="toggleAnnouncements()">🔔</button>
                    <span id="notification-badge" class="hidden"></span>
                    
                    <div id="announcements-dropdown" class="hidden">
                        <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; color: var(--text-color);">Announcements</h4>
                        <div id="announcements-list"></div>
                    </div>
                </div>
                
                <button id="theme-toggle" class="btn-icon" onclick="toggleDarkMode()">🌙</button>
                <button class="btn-danger" onclick="logout()">Logout</button> 
            </div>
        </nav>

        <main>
            <section id="upload-panel" class="hidden">
                <select id="note-semester" onchange="updateSubjectDropdowns()" style="padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);">
                    <option value="Semester 1">Semester 1</option>
                    <option value="Semester 2">Semester 2</option>
                    <option value="Semester 3">Semester 3</option>
                    <option value="Semester 4">Semester 4</option>
                    <option value="Semester 5">Semester 5</option>
                    <option value="Semester 6">Semester 6</option>
                    <option value="Semester 7">Semester 7</option>
                    <option value="Semester 8">Semester 8</option>
                    <option value="Semester 9">Semester 9</option>
                    <option value="Semester 10">Semester 10</option>
                </select>

                <div style="padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
                    <h3 style="margin-bottom: 15px; font-size: 1.1rem; color: var(--text-color);">Make an Announcement</h3>
                    <select id="announcement-semester" style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color);">
                        <option value="All">All Semesters</option>
                        <option value="Semester 1">Semester 1</option>
                        <option value="Semester 2">Semester 2</option>
                        <option value="Semester 3">Semester 3</option>
                        <option value="Semester 4">Semester 4</option>
                        <option value="Semester 5">Semester 5</option>
                        <option value="Semester 6">Semester 6</option>
                        <option value="Semester 7">Semester 7</option>
                        <option value="Semester 8">Semester 8</option>
                        <option value="Semester 9">Semester 9</option>
                        <option value="Semester 10">Semester 10</option>
                    </select>  
                    <textarea id="announcement-text" placeholder="Type your announcement here..." style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); box-sizing: border-box; margin-bottom: 10px; resize: vertical; min-height: 80px; background-color: var(--bg-color); color: var(--text-color);"></textarea>
                    <button class="btn-primary" onclick="postAnnouncement()">Broadcast to Students</button>
                </div>
            
                <div style="margin-top: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
                    <h3 style="margin-bottom: 15px; font-size: 1.1rem; color: var(--text-color);">Manage Subjects</h3>  
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="new-subject-name" placeholder="New Subject Name" style="flex: 1; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); box-sizing: border-box;">
                        <button class="btn-success" style="padding: 10px 15px;" onclick="addSubject()">Add</button>
                    </div>
                    
                    <div style="display: flex; gap: 10px;">
                        <select id="delete-subject-select" style="flex: 1; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); box-sizing: border-box;">
                            </select>
                        <button class="btn-danger" style="padding: 10px 15px;" onclick="deleteSubject()">Remove</button>
                    </div>
                </div>
                
                <h2 style="margin-top: 20px;">Add New Resource</h2>
                <div class="upload-grid">
                    <input type="text" id="note-title" placeholder="Title" style="flex: 1;">
                    <input type="text" id="note-link" placeholder="Link to PDF/Drive" style="flex: 1;">
                    <select id="note-category" style="padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);"></select>
                    <button class="btn-success" onclick="addNote()" id="submit-btn">Post Note</button>
                    <button class="btn-warning hidden" onclick="cancelEdit()" id="cancel-edit-btn">Cancel Edit</button>
                </div>
            </section>

            <section id="repo-section">
                <h2>Repository</h2>
                <div id="notes-container" class="notes-grid">
                </div>
            </section>
        </main>
    </div>
    
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="script.js"></script>
</body>
</html>
